plugins { id 'com.android.application' }
def identity = new groovy.json.JsonSlurper().parseText(providers.exec {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('scripts/build-version.py').absolutePath
}.standardOutput.asText.get())
// Copy exact production files into an isolated source root; javac must not implicitly
// discover unrelated UI/parser classes through the application's complete source path.
def stageWorkerSources = tasks.register('stageWorkerSources', Sync) {
    from(rootProject.file('app/src/main/java')) {
        include 'org/diemobile/BinaryWorkerService.java', 'org/diemobile/BinaryWorkerClient.java',
                'org/diemobile/BinaryRunner.java', 'org/diemobile/ArchiveRunner.java',
                'org/diemobile/ArchiveEngine.java', 'org/diemobile/HashEngine.java',
                'org/diemobile/BinwalkEngine.java', 'org/diemobile/PhotoRecEngine.java', 'org/diemobile/MpvEngine.java',
                'org/diemobile/AndroidResourceProbe.java', 'org/diemobile/AndroidResourceDocument.java',
                'org/diemobile/AndroidResourceFacts.java', 'org/diemobile/EvidenceRows.java',
                'org/diemobile/EvidenceJson.java', 'org/diemobile/Inspector.java',
                'org/diemobile/InputSnapshot.java', 'org/diemobile/RangeAnalysis.java',
                'org/diemobile/FileRange.java', 'org/diemobile/NativeArchiveStore.java'
        include 'org/diemobile/MediaFrame.java', 'org/diemobile/PdfPagePreview.java',
                'org/diemobile/OwnedContent.java', 'org/diemobile/PreparedExport.java'
        include 'org/diemobile/PackageManifest.java'
        include 'org/diemobile/TextActions.java', 'org/diemobile/WorkbenchUi.java'
    }
    into layout.buildDirectory.dir('shared-worker-sources')
}
def stageTextActionResources = tasks.register('stageTextActionResources', Sync) {
    from(rootProject.file('app/src/main/res')) {
        include 'values/colors.xml', 'values/text_action_ids.xml'
    }
    into layout.buildDirectory.dir('shared-text-resources')
}
def stageWorkerNotices = tasks.register('stageWorkerNotices', Sync) {
    from(rootProject.file('generated-assets')) { include 'notices/**' }
    from(rootProject.file('app/src/main/assets')) {
        include 'notices/DiE-Android-LICENSE.txt', 'notices/rhash-md4-1.4.5.txt',
                'notices/android-resources-32.5.1.txt', 'notices/dex-dependencies.txt',
                'notices/photorec-7.2.txt', 'notices/photorec-source-headers.txt'
    }
    into layout.buildDirectory.dir('runtime-notices')
}
android {
    namespace 'org.diemobile'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.diemobile.runtimecheck'
        minSdk 26
        targetSdk 35
        versionCode identity.versionCode
        versionName identity.versionName
        testInstrumentationRunner 'org.diemobile.WorkerRuntimeInstrumentation'
        buildConfigField 'String', 'SOURCE_REVISION', groovy.json.JsonOutput.toJson(identity.sourceRevision)
        buildConfigField 'boolean', 'SOURCE_DIRTY', (identity.sourceDirty != false).toString()
        ndk { abiFilters 'x86_64' }
        externalNativeBuild { cmake { targets 'diehash'; arguments '-DANDROID_STL=c++_static', '-DCMAKE_C_FLAGS_DEBUG=-g0', '-DCMAKE_CXX_FLAGS_DEBUG=-g0' } }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path '../app/src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main {
        java.srcDir layout.buildDirectory.dir('shared-worker-sources')
        res.srcDir layout.buildDirectory.dir('shared-text-resources')
        jniLibs.srcDir '../app/build/generated-archive-jni'
        jniLibs.srcDir '../app/build/generated-photorec-jni'
        assets.srcDir '../app/build/generated-archive-assets'
        assets.srcDir layout.buildDirectory.dir('runtime-notices')
        assets.srcDir layout.buildDirectory.dir('generated-runtime-assets')
    }
    sourceSets.androidTest.java.srcDir rootProject.file('tests/fixtures/metadata')
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "GlassDigestor-worker-runtime-${variant.versionName}-x86_64-${variant.name}.apk"
        }
    }
}
dependencies { implementation project(':resource-engine') }
def buildRuntimeArchive = tasks.register('buildRuntimeArchive', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/build-archive.sh').absolutePath, 'android'
    environment 'DIE_ANDROID_ABI', 'x86_64'
    if (gradle.startParameter.offline) environment 'DIE_OFFLINE', 'true'
    inputs.files(rootProject.fileTree('archive-engine'), rootProject.files('scripts/build-archive.sh', 'scripts/build-archive-libraries.sh'))
    outputs.file(rootProject.file('app/build/generated-archive-jni/x86_64/libdiearchive.so'))
}
def buildRuntimePhotoRec = tasks.register('buildRuntimePhotoRec', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/build-photorec.sh').absolutePath, 'android'
    environment 'DIE_ANDROID_ABI', 'x86_64'
    if (gradle.startParameter.offline) environment 'DIE_OFFLINE', 'true'
    inputs.files(rootProject.fileTree('carving-engine'), rootProject.files('scripts/build-photorec.sh',
            'scripts/fetch-photorec.sh', 'scripts/prepare-photorec.py', 'scripts/photorec-notices.py'))
    outputs.file rootProject.file('app/build/generated-photorec-jni/x86_64/libdiephotorec.so')
}
def generateRuntimeMediaFixture = tasks.register('generateRuntimeMediaFixture', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('tests/fixtures/media/generate-preview.py').absolutePath,
            layout.buildDirectory.dir('generated-runtime-assets/test-fixtures').get().asFile.absolutePath
    inputs.files rootProject.files('tests/fixtures/media/generate-preview.py', 'tests/fixtures/media/green-64x48.mp4')
    outputs.dir layout.buildDirectory.dir('generated-runtime-assets/test-fixtures')
}
tasks.named('preBuild').configure {
    dependsOn buildRuntimeArchive, buildRuntimePhotoRec, stageWorkerSources, stageTextActionResources, stageWorkerNotices, generateRuntimeMediaFixture
}
