plugins { id 'com.android.application' }
def nativeEnabled = providers.gradleProperty('withCdie').orElse('true').get().toBoolean()
def buildIdentity = new groovy.json.JsonSlurper().parseText(providers.exec {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('scripts/build-version.py').absolutePath
}.standardOutput.asText.get())
android {
    namespace 'org.diemobile'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.diemobile'
        minSdk 26
        targetSdk 35
        versionCode buildIdentity.versionCode
        versionName buildIdentity.baseVersionName
        resValue 'string', 'app_name', buildIdentity.productName
        buildConfigField 'String', 'PRODUCT_NAME', groovy.json.JsonOutput.toJson(buildIdentity.productName)
        buildConfigField 'String', 'SOURCE_REVISION', groovy.json.JsonOutput.toJson(buildIdentity.sourceRevision)
        buildConfigField 'boolean', 'SOURCE_DIRTY', (buildIdentity.sourceDirty != false).toString()
        if (nativeEnabled) {
            ndk { abiFilters 'arm64-v8a' }
            externalNativeBuild { cmake { targets 'diemobile', 'diehash' } }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { versionNameSuffix buildIdentity.versionName.substring(buildIdentity.baseVersionName.length()) }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "${buildIdentity.artifactName}-${variant.versionName}-arm64-v8a-${variant.name}.apk"
        }
    }
    if (nativeEnabled) {
        externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    }
    sourceSets { main { assets.srcDir '../generated-assets' } }
    sourceSets { main { jniLibs.srcDir layout.buildDirectory.dir('generated-binwalk-jni') } }
    sourceSets { main { jniLibs.srcDir layout.buildDirectory.dir('generated-mpv-jni') } }
    sourceSets { main { jniLibs.srcDir layout.buildDirectory.dir('generated-photorec-jni') } }
    sourceSets { main { jniLibs.srcDir layout.buildDirectory.dir('generated-archive-jni'); assets.srcDir layout.buildDirectory.dir('generated-archive-assets') } }
    sourceSets { test { java.srcDirs '../tests/fixtures/dex', '../tests/fixtures/metadata', '../tests/fixtures/resources', '../tests/fixtures/signing', '../tests/fixtures/carving' } }
    packaging { resources { merges += ['LICENSE'] } }
    packaging { jniLibs { keepDebugSymbols += ['**/libmpv.so', '**/libav*.so', '**/libsw*.so', '**/libc++_shared.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def hostLibraryDirectory = file(providers.gradleProperty('hostNativeLibraryDir').orElse(file('build/host-native').absolutePath).get())
            def fixtureDirectory = file(providers.gradleProperty('nativeFixturesDir').orElse(file('build/host-ui-fixtures').absolutePath).get())
            def binaryLibraryDirectory = file(providers.gradleProperty('hostBinaryLibraryDir').orElse(file('build/host-binwalk').absolutePath).get())
            def mediaLibraryDirectory = file(providers.gradleProperty('hostMediaLibraryDir').orElse(file('build/host-mpv').absolutePath).get())
            def carvingLibraryDirectory = file('build/host-photorec')
            def archiveLibraryDirectory = file('build/host-archive')
            def archiveFixtures = file('build/host-archive-fixtures')
            // Robolectric SDK/animation state and loaded JNI belong to one test class.
            // Fresh serial JVMs also release per-class engine copies on constrained builders.
            maxParallelForks = 1
            forkEvery = 1
            // Include dependency/engine failure causes in CI, not only exception class names.
            testLogging { exceptionFormat = 'full' }
            maxHeapSize = '1g'
            systemProperty 'user.home', file('build/test-runtime-home').absolutePath
            doFirst { file('build/test-runtime-home').mkdirs() }
            jvmArgs "-Djava.library.path=${hostLibraryDirectory.absolutePath}${File.pathSeparator}${binaryLibraryDirectory.absolutePath}${File.pathSeparator}${mediaLibraryDirectory.absolutePath}${File.pathSeparator}${carvingLibraryDirectory.absolutePath}${File.pathSeparator}${archiveLibraryDirectory.absolutePath}", '--add-opens=java.base/java.io=ALL-UNNAMED'
            systemProperty 'die.fixture.dir', fixtureDirectory.absolutePath
            systemProperty 'die.archive.fixture.dir', archiveFixtures.absolutePath
            inputs.dir(archiveFixtures).withPropertyName('archiveFixtures')
            inputs.file(new File(archiveLibraryDirectory, 'libdiearchive.so')).withPropertyName('hostArchiveLibrary')
            // Native/fixture changes must invalidate a previous passing Test task,
            // even when none of the Java sources or test parameters changed.
            inputs.file(new File(hostLibraryDirectory, 'libdiemobile.so')).withPropertyName('hostNativeLibrary')
            inputs.file(new File(hostLibraryDirectory, 'libdiehash.so')).withPropertyName('hostHashLibrary')
            inputs.dir(fixtureDirectory).withPropertyName('nativeFixtures')
            inputs.file(new File(binaryLibraryDirectory, 'libdiebinwalk.so')).withPropertyName('hostBinwalkLibrary')
            inputs.file(new File(mediaLibraryDirectory, 'libdiempv.so')).withPropertyName('hostMpvLibrary')
            inputs.file(new File(carvingLibraryDirectory, 'libdiephotorec.so')).withPropertyName('hostPhotoRecLibrary')
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

def buildBinwalkAndroid = tasks.register('buildBinwalkAndroid', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/build-binwalk.sh').absolutePath, 'android'
    environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
    if (gradle.startParameter.offline) environment 'CARGO_NET_OFFLINE', 'true'
    inputs.files(rootProject.fileTree('binary-engine') { include '**/*.rs', '**/*.toml', 'Cargo.lock'; exclude '**/target/**' })
    inputs.files(rootProject.fileTree('vendor/Binwalk/src') { include '**/*.rs' })
    inputs.files(rootProject.files('scripts/build-binwalk.sh', 'scripts/fetch-binwalk.sh'))
    outputs.file(layout.buildDirectory.file('generated-binwalk-jni/arm64-v8a/libdiebinwalk.so'))
}
tasks.named('preBuild').configure { dependsOn buildBinwalkAndroid }

